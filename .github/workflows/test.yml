name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Day math reads local clock components — run the suite in both
        # hemispheres' offsets and UTC so timezone regressions fail here.
        tz: [UTC, America/Los_Angeles, Asia/Kolkata, Australia/Sydney]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TZ: ${{ matrix.tz }}
